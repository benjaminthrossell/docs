<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Desktop / Mobile</title>
<style>
:root{--bg:#E9E8E5;--ink:#111;--mid:#6b6b6b;--line:#d6d5d1;--card:#F7F6F3}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font:500 14px/1.3 -apple-system,"Geist",system-ui,sans-serif;color:var(--ink)}
.bar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line);z-index:5;overflow-x:auto}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:none;font:inherit;padding:7px 14px;border-radius:8px;color:var(--mid);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--card)}
.ttl{font-weight:600;white-space:nowrap;flex:none}
.note{color:var(--mid);white-space:nowrap;margin-left:auto;flex:none}
.stage{position:absolute;top:56px;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;padding:20px}
.frame{background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.18);transform-origin:top center;overflow:hidden}
.mobile .frame{border-radius:44px;border:12px solid #111}
iframe{border:0;display:block;width:100%;height:100%;background:#fff}
</style></head><body>
<div class="bar">
  <span class="ttl" id="ttl"></span>
  <div class="seg" id="opts"></div>
  <div class="seg" id="dev"><button data-d="desktop">Desktop</button><button data-d="mobile">Mobile</button></div>
  <span class="note" id="note"></span>
</div>
<div class="stage" id="stage"><div class="frame" id="frame"><iframe id="f"></iframe></div></div>
<script>
// view.html?title=..&o=Label|url&o=Label|url&d=mobile
const q=new URLSearchParams(location.search);
const opts=q.getAll('o').map(s=>{const i=s.indexOf('|');return{l:s.slice(0,i),u:s.slice(i+1)}});
if(!opts.length&&q.get('src'))opts.push({l:'',u:q.get('src')});
let cur=+(q.get('i')||0), dev=q.get('d')||'desktop';
document.getElementById('ttl').textContent=q.get('title')||'';
const oEl=document.getElementById('opts');
if(opts.length>1)opts.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o.l;b.onclick=()=>{cur=i;load()};oEl.appendChild(b)});else oEl.style.display='none';
document.querySelectorAll('#dev button').forEach(b=>b.onclick=()=>{dev=b.dataset.d;load()});
const SZ={desktop:[1440,900],mobile:[390,844]};
function fit(){const st=document.getElementById('stage'),fr=document.getElementById('frame');
 const [w,h]=SZ[dev];const pad=dev==='mobile'?24:0;
 const aw=st.clientWidth-40, ah=st.clientHeight-40;
 const s=Math.min(1,aw/(w+pad),ah/(h+pad));
 fr.style.width=(w+pad)+'px';fr.style.height=(h+pad)+'px';fr.style.transform='scale('+s+')';
 document.getElementById('note').textContent=w+' × '+h+(s<1?' · shown at '+Math.round(s*100)+'%':'');}
function load(){document.body.className=dev;
 oEl.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur));
 document.querySelectorAll('#dev button').forEach(b=>b.classList.toggle('on',b.dataset.d===dev));
 fit();const f=document.getElementById('f');const u=opts[cur].u;f.src='about:blank';setTimeout(()=>{f.src=u},30);const p=new URLSearchParams(location.search);p.set('i',cur);p.set('d',dev);history.replaceState(null,'','?'+p);}
addEventListener('resize',fit);load();
</script></body></html>
